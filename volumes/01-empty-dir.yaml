apiVersion: v1
kind: Pod
metadata:
  name: myapp
spec:
  containers:
  - image: nginx
    name: nginx
    volumeMounts:
    - mountPath: /var/log/nginx
      name: nginx-logs
  - image: almalinux:9
    name: almalinux 
    volumeMoounts:
    - mountPath: /mnt/nginx-logs
      name: nginx-logs
      readOnly: true
  # This is at the pod level
  volumes: 
  - name: nginx-logs
    emptyDir:
      sizeLimit: 500Mi